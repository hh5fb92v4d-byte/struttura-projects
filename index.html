<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f10" />
  <meta name="description" content="STRUTTURA Projects – zakázky, materiály, příjmy, náklady a ziskovost." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=105" />
  <title>STRUTTURA Projects V1.05</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <img src="assets/logo_vertical_light.svg" class="brand-logo" alt="STRUTTURA" />
        <div class="brand-projects">PROJECTS <span id="versionLabel">V1.05</span></div>
      </div>
      <div class="top-actions">
        <div class="cloud-status" id="cloudStatus" title="Stav cloudové synchronizace"><span class="cloud-dot"></span><span class="cloud-label">Cloud</span></div>
        <button class="icon-btn" id="backupBtn" aria-label="Záloha dat" title="Záloha dat">↥</button>
      </div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Hlavní navigace">
      <button class="nav-item active" data-route="dashboard"><span class="nav-icon">⌂</span><span>Přehled</span></button>
      <button class="nav-item" data-route="jobs"><span class="nav-icon">▤</span><span>Zakázky</span></button>
      <button class="nav-item nav-add" data-route="new"><span class="nav-icon">＋</span><span>Nová</span></button>
      <button class="nav-item" data-route="finance"><span class="nav-icon">Kč</span><span>Finance</span></button>
      <button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span><span>Více</span></button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=105"></script>
  <script src="app.js?v=105" defer></script>
</body>
</html>
